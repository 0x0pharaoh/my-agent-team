[project]
name = "my-team-agents"
version = "0.0.1"
description = "Local memory, messaging and ticket platform for supervised multi-agent development."
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "filelock==4.0.1",
    "mcp==2.2.0",
    "platformdirs==4.11.12",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
]

[project.scripts]
my-team = "my_team.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_team"]
